<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a5fb4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>음성 수준측량 야장</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#d8dce2;--pr:#1a5fb4;--ok:#1a7f37;--ng:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2329;--tx:#e8eaed;--mu:#9aa3ad;--bd:#343b44;--pr:#5b9cf0;--ok:#5fd07f;--ng:#ff8a80}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2329;--tx:#e8eaed;--mu:#9aa3ad;--bd:#343b44;--pr:#5b9cf0;--ok:#5fd07f;--ng:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;font-size:15px}
main{max-width:820px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:12px;color:var(--mu)}
input,select,button{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{background:var(--pr);color:#fff;border:0;font-weight:600;cursor:pointer}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
#mic{padding:16px;font-size:17px}#mic.on{background:var(--ng)}
.row{display:flex;gap:8px;margin-top:8px}
.log{font-size:13px;color:var(--mu);margin-top:8px;min-height:18px}
.w{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{border:1px solid var(--bd);padding:5px 7px;text-align:right}
th{background:var(--bg)}td:first-child,th:first-child{text-align:left}
.res div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--ng);font-weight:700}.warn{color:var(--mu)}
summary{font-weight:700;cursor:pointer}
small{color:var(--mu)}
#ph{display:none}
@media print{
:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--card:#fff;--tx:#000;--mu:#000;--bd:#000}
body{background:#fff;color:#000}
.card{border:0;padding:0}
.card:not(.pr),small,h1{display:none}
#ph{display:block;margin-bottom:10px}
#ph h2{margin:0 0 6px;font-size:18px}
th{background:#eee}
.w{overflow:visible}
}
</style>
</head>
<body>
<main>
<h1>🎙️ 음성 수준측량 야장</h1>

<div class="card">
 <div class="g">
  <div><label>야장 방식</label><select id="mode"><option value="ki">기고식</option><option value="go">고차식</option></select></div>
  <div><label>측량 방식</label><select id="survey"><option value="wang">왕복측량</option><option value="pye">폐합측량</option><option value="gyeol">결합측량</option></select></div>
  <div><label>출발 측점명</label><input id="sname" value="BM"></div>
  <div><label>출발 지반고 (m)</label><input id="gh0" type="number" step="0.001" value="100.000"></div>
  <div id="closeBox" style="display:none"><label>도착 기지표고 (m)</label><input id="close" type="number" step="0.001"></div>
  <div><label>총 거리 L (km, 왕복은 편도)</label><input id="L" type="number" step="0.01" placeholder="예: 0.5"></div>
  <div><label>허용오차 상수 C (mm/√km)</label><input id="C" type="number" step="0.5" value="10"></div>
 </div>
</div>

<div class="card">
 <button id="mic">🎤 음성 입력 시작</button>
 <div class="log" id="log">"후시 일 점 이삼사" · "전시 에이 일 점 사오육"(측점명을 말하면 전시/TP) · "중간 이 점 일" · "취소"</div>
 <div class="row">
  <select id="type" style="width:45%"><option value="BS">후시</option><option value="FS">전시(이기점)</option><option value="IP">중간점</option></select>
  <input id="nm" placeholder="측점명 (선택)">
 </div>
 <div class="row">
  <input id="val" type="number" step="0.001" placeholder="값 (m)" inputmode="decimal">
  <button id="add" style="width:35%">추가</button>
 </div>
 <div class="row"><button class="s" id="undo">마지막 취소</button><button class="s" id="copy">표 복사</button><button class="s" id="print">🖨️ 인쇄/PDF</button><button class="s" id="reset">초기화</button></div>
</div>

<div class="card pr" id="ph"></div>
<div class="card w pr"><table id="tb"></table></div>
<div class="card res pr" id="res"></div>
<div class="card w pr"><details open><summary>📐 수준차 계산부</summary><div id="diff" style="margin-top:8px"></div></details></div>
<small>기고식: IH=GH+BS, GH=IH−FS · 측점명을 말한 전시는 TP로 기록 · 허용오차=C√L</small>
</main>
<script>
const $=id=>document.getElementById(id);
const ST=['mode','survey','sname','gh0','close','L','C'];
let rows=[];
try{const s=localStorage.getItem('lv');if(s)rows=JSON.parse(s);const t=JSON.parse(localStorage.getItem('lvs')||'{}');ST.forEach(i=>{if(t[i]!=null)$(i).value=t[i]})}catch(e){}
const save=()=>{try{localStorage.setItem('lv',JSON.stringify(rows));const t={};ST.forEach(i=>t[i]=$(i).value);localStorage.setItem('lvs',JSON.stringify(t))}catch(e){}};
const f=(x,d=3)=>x==null||isNaN(x)?'':x.toFixed(d);
const sg=d=>(d>=0?'+':'−')+f(Math.abs(d));
const NM={'영':0,'공':0,'일':1,'이':2,'삼':3,'사':4,'오':5,'육':6,'칠':7,'팔':8,'구':9};
const NUMTOK=/^[0-9영공일이삼사오육칠팔구점.]+$/;
const LET={에이:'A',비:'B',씨:'C',디:'D',이:'E',에프:'F',지:'G',에이치:'H',아이:'I',제이:'J',케이:'K',엘:'L',엠:'M',엔:'N',피:'P',큐:'Q',알:'R',에스:'S',티:'T',유:'U',브이:'V',더블유:'W',엑스:'X',와이:'Y',제트:'Z',비엠:'BM'};
const normName=s=>{s=s.replace(/\s+/g,'').replace(/점$/,'');return LET[s]||s.toUpperCase()};
function toNum(t){
 t=t.replace(/\s/g,'').replace(/점/g,'.').replace(/[영공일이삼사오육칠팔구]/g,c=>NM[c]);
 const m=t.match(/\d+(\.\d+)?/);if(!m)return null;
 const s=m[0];
 if(!s.includes('.')&&s.length>=3)return parseInt(s,10)/1000;
 return parseFloat(s);
}
function say(m){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m);u.lang='ko-KR';speechSynthesis.speak(u)}catch(e){}}
function addRow(type,v,speak,name){
 if(v==null||isNaN(v)){$('log').textContent='숫자를 인식하지 못했습니다';return}
 if(type!=='BS'&&!rows.some(r=>r.t==='BS')){$('log').textContent='먼저 후시를 입력하세요';say('먼저 후시를 입력하세요');return}
 const r={t:type,v};if(name&&type==='FS')r.name=name;
 rows.push(r);save();render();
 const n=(type==='FS'&&name?'전시 '+name:{BS:'후시',FS:'전시',IP:'중간점'}[type]);
 $('log').textContent=n+' '+f(v)+' 입력됨';if(speak)say(n+' '+f(v));
}
function handle(txt){
 $('log').textContent='인식: '+txt;
 if(/취소|삭제/.test(txt)){rows.pop();save();render();say('취소');return}
 let t=null;
 if(/후시|뒤/.test(txt))t='BS';else if(/전시|이기점|티피|앞/.test(txt))t='FS';else if(/중간|아이피/.test(txt))t='IP';
 const body=txt.replace(/후시|전시|중간점|중간|이기점|티피|아이피|뒤|앞|측점|미터|밀리|메다|,/g,' ').trim();
 const tk=body.split(/\s+/).filter(Boolean);
 let e=tk.length;while(e>0&&NUMTOK.test(tk[e-1]))e--;
 let nameTk=tk.slice(0,e),run=tk.slice(e);
 const pi=run.findIndex(x=>/[점.]/.test(x));
 if(pi>=0){const vs=run[pi]==='점'?Math.max(pi-1,0):pi;nameTk=nameTk.concat(run.slice(0,vs));run=run.slice(vs)}
 const name=nameTk.length?normName(nameTk.join('')):'';
 if(name&&t!=='BS')t='FS';
 if(!t){say('명령을 인식하지 못했습니다');return}
 addRow(t,toNum(run.join('')),true,name);
}
function roundTrip(c){
 const F=c.out.filter(o=>o.t==='FS'),seen=new Set([c.sn]),r={ok:false,msg:''};
 let j=-1;
 for(let i=0;i<F.length;i++){if(seen.has(F[i].name)){j=i;break}seen.add(F[i].name)}
 if(!F.length){r.msg='전시를 측점명과 함께 입력하세요 (왕복은 같은 측점명으로 짝을 맞춥니다)';return r}
 if(j<0){r.msg='아직 복측(되돌아오는 측량)이 시작되지 않았습니다';return r}
 const last=F[F.length-1];
 if(last.name!==c.sn){r.msg='복측 진행 중 — 처음 측점('+c.sn+')까지 돌아오면 계산됩니다';return r}
 const O=F.slice(0,j),I=F.slice(j),K=O.length;
 const nm=[c.sn,...O.map(o=>o.name)],Ho=[c.gh0,...O.map(o=>o.gh)],mp={};
 I.forEach(o=>mp[o.name]=o.gh);
 const Hi=nm.map((n,i)=>i===0?last.gh:(i===K?Ho[K]:mp[n]));
 if(Hi.some(x=>x==null)){r.msg='왕측과 복측의 측점명이 일치하지 않습니다 (측점명을 확인하세요)';return r}
 r.ok=true;r.E=(last.gh-c.gh0)*1000;
 r.within=c.tol==null?null:Math.abs(r.E)<=c.tol;
 let H=c.gh0;
 r.rows=nm.map((n,i)=>{
  if(i===0)return{n,ho:Ho[0],hi:Hi[0],e:Hi[0]-Ho[0],best:c.gh0};
  const dO=Ho[i]-Ho[i-1],dI=Hi[i]-Hi[i-1],dA=(dO+dI)/2;H+=dA;
  return{n,ho:Ho[i],hi:Hi[i],e:Hi[i]-Ho[i],dO,dI,dA,best:H};
 });
 return r;
}
function calc(){
 const sv=$('survey').value,gh0=parseFloat($('gh0').value)||0,sn=normName($('sname').value||'BM');
 let IH=null,ref=gh0,refName=sn,setRef=gh0,setBS=0,fs=0,ip=0,sBS=0,sFS=0;const out=[];
 for(const r of rows){
  if(r.t==='BS'){IH=ref+r.v;setRef=ref;setBS=r.v;sBS+=r.v;out.push({t:'BS',name:refName,v:r.v,IH,gh:ref,k:fs})}
  else if(IH==null)continue;
  else if(r.t==='FS'){const gh=IH-r.v;fs++;sFS+=r.v;ref=gh;refName=r.name||('TP'+fs);out.push({t:'FS',name:refName,v:r.v,gh,d:gh-setRef,k:fs,bs:setBS})}
  else{const gh=IH-r.v;ip++;out.push({t:'IP',name:'IP'+ip,v:r.v,gh,d:gh-setRef,k:fs})}
 }
 const cl=sv==='gyeol'?($('close').value===''?null:parseFloat($('close').value)):gh0;
 const E=(fs>0&&cl!=null)?(ref-cl)*1000:null;
 const L=parseFloat($('L').value),C=parseFloat($('C').value),tol=(L>0&&C>0)?C*Math.sqrt(L):null;
 const c={out,gh0,fs,sBS,sFS,ref,E,tol,sv,sn,cl};
 if(sv==='wang'){
  c.w=roundTrip(c);
  if(c.w.ok&&c.w.within!==false){const m={};c.w.rows.forEach(x=>m[x.n]=x.best);for(const o of out)if(o.t==='FS'&&m[o.name]!=null)o.adj=m[o.name]}
 }else if(E!=null)for(const o of out)if(o.t!=='BS')o.adj=o.gh-(E/1000)*o.k/fs;
 return c;
}
const vd=(E,tol)=>tol==null?'<span class=warn>L 입력 필요 (판정 불가)</span>':(Math.abs(E)<=tol?'<span class=ok>허용범위 이내</span>':'<span class=ng>허용오차 초과 · 재측 필요</span>');
function diffHTML(c){
 const th=a=>'<tr>'+a.map(x=>`<th>${x}</th>`).join('')+'</tr>';
 let h='<table>',s='';
 if(c.sv==='wang'){
  const w=c.w;
  if(!w.ok)return '<small>'+w.msg+'</small>';
  const okc=w.within!==false;
  h+=th(['측점','왕측 GH','복측 GH','오차량 (복−왕) mm','구간 왕Δ','구간 복Δ','평균Δ','최확치 GH']);
  w.rows.forEach((x,i)=>{h+=`<tr><td>${x.n}</td><td>${f(x.ho)}</td><td>${f(x.hi)}</td><td>${f(x.e*1000,1)}</td><td>${x.dO==null?'':sg(x.dO)}</td><td>${x.dI==null?'':sg(x.dI)}</td><td>${x.dA==null?'':sg(x.dA)}</td><td>${okc||i===0?f(x.best):'—'}</td></tr>`});
  s=`<div><span>왕복 폐합오차 E</span><b>${f(w.E,1)} mm</b></div><div><span>허용오차 C√L</span><b>${c.tol!=null?'±'+f(c.tol,1)+' mm':'-'}</b></div><div><span>판정</span>${vd(w.E,c.tol)}</div><small>최확치: 출발점을 고정하고 구간별 왕·복 고저차의 평균을 누적 (= 왕복 높이 평균 − E/2)</small>`;
 }else{
  h+=th(['측점','후시','전시','고저차','관측 GH','오차 배분(mm)','최확치 GH']);
  h+=`<tr><td>${c.sn}</td><td></td><td></td><td></td><td>${f(c.gh0)}</td><td></td><td>${f(c.gh0)}</td></tr>`;
  for(const o of c.out)if(o.t==='FS')h+=`<tr><td>${o.name}</td><td>${f(o.bs)}</td><td>${f(o.v)}</td><td>${sg(o.d)}</td><td>${f(o.gh)}</td><td>${c.E!=null?f(-c.E*o.k/c.fs,1):''}</td><td>${o.adj!=null?f(o.adj):''}</td></tr>`;
  s=`<div><span>ΣBS / ΣFS / 고저차 합</span><b>${f(c.sBS)} / ${f(c.sFS)} / ${sg(c.sBS-c.sFS)}</b></div>`;
  if(c.E!=null)s+=`<div><span>${c.sv==='pye'?'폐합':'결합'}오차 E</span><b>${f(c.E,1)} mm</b></div><div><span>허용오차 C√L</span><b>${c.tol!=null?'±'+f(c.tol,1)+' mm':'-'}</b></div><div><span>판정</span>${vd(c.E,c.tol)}</div><small>오차는 이기점(TP) 수에 비례해 배분</small>`;
  else s+='<small>도착 기지표고와 전시를 입력하면 오차량이 계산됩니다</small>';
 }
 return h+'</table><div class=res style="margin-top:8px">'+s+'</div>';
}
function render(){
 const c=calc(),go=$('mode').value==='go';
 $('closeBox').style.display=c.sv==='gyeol'?'':'none';
 const ah=c.sv==='wang'?'최확치':'보정GH';
 let h=go?`<tr><th>측점</th><th>BS</th><th>FS/IP</th><th>승(+)</th><th>강(−)</th><th>GH</th><th>${ah}</th></tr>`
         :`<tr><th>측점</th><th>BS</th><th>IH</th><th>FS(TP)</th><th>IP</th><th>GH</th><th>${ah}</th></tr>`;
 for(const o of c.out){
  const gh=f(o.gh),adj=o.adj!=null?f(o.adj):'';
  if(go){
   const fv=o.t==='BS'?'':(o.t==='IP'?'('+f(o.v)+')':f(o.v));
   h+=`<tr><td>${o.name}</td><td>${o.t==='BS'?f(o.v):''}</td><td>${fv}</td><td>${o.d>0?f(o.d):''}</td><td>${o.d<0?f(-o.d):''}</td><td>${gh}</td><td>${adj}</td></tr>`;
  }else{
   h+=`<tr><td>${o.name}</td><td>${o.t==='BS'?f(o.v):''}</td><td>${o.t==='BS'?f(o.IH):''}</td><td>${o.t==='FS'?f(o.v):''}</td><td>${o.t==='IP'?f(o.v):''}</td><td>${gh}</td><td>${adj}</td></tr>`;
  }
 }
 $('tb').innerHTML=h;
 let r=`<div><span>ΣBS − ΣFS</span><b>${f(c.sBS-c.sFS)} m</b></div>`;
 r+=`<div><span>검산 (마지막GH − 출발GH)</span><b>${f(c.ref-c.gh0)} m ${Math.abs((c.sBS-c.sFS)-(c.ref-c.gh0))<0.0005?'<span class=ok>✔</span>':'<span class=ng>✘</span>'}</b></div>`;
 if(c.sv==='wang'){
  if(!c.w.ok)r+=`<div><span>왕복 상태</span><b>${c.w.msg}</b></div>`;
  else r+=`<div><span>왕복 폐합오차 E</span><b>${f(c.w.E,1)} mm</b></div><div><span>허용오차 C√L</span><b>${c.tol!=null?'±'+f(c.tol,1)+' mm':'-'}</b></div><div><span>판정</span>${vd(c.w.E,c.tol)}${c.w.within===false?'':' · 왕복 평균 최확치 계산됨'}</div>`;
 }else if(c.sv==='gyeol'&&c.cl==null)r+='<div><span>도착 기지표고를 입력하세요</span></div>';
 else if(c.E!=null)r+=`<div><span>${c.sv==='pye'?'폐합':'결합'}오차 E</span><b>${f(c.E,1)} mm</b></div><div><span>허용오차 C√L</span><b>${c.tol!=null?'±'+f(c.tol,1)+' mm':'L 입력 필요'}</b></div><div><span>판정</span>${vd(c.E,c.tol)}</div>`;
 $('res').innerHTML=r;
 $('diff').innerHTML=diffHTML(c);
}
ST.forEach(i=>$(i).addEventListener('input',()=>{save();render()}));
$('add').onclick=()=>{let t=$('type').value;const n=$('nm').value.trim()?normName($('nm').value.trim()):'';if(n&&t!=='BS')t='FS';addRow(t,parseFloat($('val').value),false,n);$('val').value='';$('nm').value=''};
$('undo').onclick=()=>{rows.pop();save();render()};
$('reset').onclick=()=>{rows=[];save();render()};
$('copy').onclick=()=>{
 const t=[$('tb'),...document.querySelectorAll('#diff table')].map(tb=>[...tb.rows].map(r=>[...r.cells].map(c=>c.textContent).join('\t')).join('\n')).join('\n\n');
 try{navigator.clipboard.writeText(t).then(()=>$('log').textContent='야장과 수준차 계산부를 복사했습니다 (엑셀에 붙여넣기)')}catch(e){$('log').textContent='복사 실패'}
};
$('print').onclick=()=>{
 const g=$('mode').value==='go'?'고차식':'기고식',sv=$('survey').selectedOptions[0].textContent;
 $('ph').innerHTML='<h2>수준측량 야장 ('+g+' · '+sv+')</h2><div>측량일: '+new Date().toLocaleDateString('ko-KR')+' · 출발 '+($('sname').value||'BM')+' '+f(parseFloat($('gh0').value))+' m'+($('survey').value==='gyeol'?' · 도착 기지표고 '+f(parseFloat($('close').value))+' m':'')+' · L='+($('L').value||'-')+' km · C='+$('C').value+'</div><div style="margin-top:6px">조: ____________ 관측자: ____________ 기록자: ____________</div>';
 try{window.print()}catch(e){$('log').textContent='이 환경에서는 인쇄가 막혀 있습니다. 표 복사 후 엑셀에서 인쇄하세요.'}
};
let rec=null,on=false;
$('mic').onclick=()=>{
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$('log').textContent='이 브라우저는 음성인식을 지원하지 않습니다 (Chrome 권장). 수동 입력을 사용하세요.';return}
 if(on){on=false;rec.stop();return}
 rec=new SR();rec.lang='ko-KR';rec.continuous=true;rec.interimResults=false;
 rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)handle(e.results[i][0].transcript)};
 rec.onerror=e=>{$('log').textContent='음성 오류: '+e.error+(e.error==='not-allowed'?' (마이크 권한 필요)':'')};
 rec.onend=()=>{if(on){try{rec.start()}catch(e){}}else{$('mic').classList.remove('on');$('mic').textContent='🎤 음성 입력 시작'}};
 on=true;rec.start();$('mic').classList.add('on');$('mic').textContent='⏹ 듣는 중… (누르면 중지)';
};
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
